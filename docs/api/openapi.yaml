  /payments:
    post:
      operationId: payments.create
      tags:
        - Payments
      summary: Record a payment against a court booking, membership, shop order, cafe order or invoice.
      description: |-
        The revenue category is derived from source_type (INVOICE: BUSINESS or MEMBERSHIP by the invoice recipient) by the view payment_ledger. tax_amount is computed at payment time (tax-inclusive sources) or pro rata (invoices). No status is written on the thing being paid: its payment status is derived from its payments. ONLINE goes through the mock gateway of the hackathon build (ADR-011): an amount whose paise are .13 (e.g. 100.13) returns PAYMENT_FAILED.

        Requirements: FR-FIN-001, FR-FIN-002, FR-INVC-004, FR-FIN-010
      x-roles:
        - MEMBER:own
        - FRONT_DESK
        - KITCHEN_MANAGER
        - STORE_MANAGER
        - OWNER_ADMIN
      x-owner: Dev 4
      x-requirements:
        - FR-FIN-001
        - FR-FIN-002
        - FR-INVC-004
        - FR-FIN-010
      x-tables:
        - payments
        - court_bookings
        - shop_orders
        - bar_orders
        - invoices
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source_type:
                  type: string
                  enum:
                    - COURT_BOOKING
                    - MEMBERSHIP
                    - SHOP_ORDER
                    - BAR_ORDER
                    - INVOICE
                source_id:
                  type: string
                  format: uuid
                amount:
                  type: string
                  pattern: ^\d+\.\d{2}$
                  description: default = remaining due. Partial payments allowed ONLY for INVOICE; every other source must equal the full amount due
                payment_method:
                  type: string
                  enum:
                    - CASH
                    - CARD
                    - UPI
                    - ONLINE
                  description: "MEMBER: ONLINE only. FRONT_DESK: CASH | CARD | UPI. OWNER_ADMIN: any"
                gateway_reference:
                  type: string
                notes:
                  type: string
              required:
                - source_type
                - source_id
                - payment_method
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/PaymentView"
                  message:
                    type: string
        "400":
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: AUTH_UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "402":
          description: PAYMENT_FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: BOOKING_NOT_FOUND | ORDER_NOT_FOUND | INVOICE_NOT_FOUND | MEMBERSHIP_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: ALREADY_PAID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: PAYMENT_AMOUNT_MISMATCH
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
