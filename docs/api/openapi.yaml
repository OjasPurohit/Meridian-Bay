  /settings/{key}:
    patch:
      operationId: settings.update
      tags:
        - Club settings
      summary: Change one setting (hours, tax rates, delivery fee, cut-offs...).
      description: |-
        Only existing keys listed in SETTING_KEYS can be changed. `value` is validated against the type of the current value.

        Requirements: FR-SET-001
      x-roles:
        - OWNER_ADMIN
      x-owner: Dev 4
      x-requirements:
        - FR-SET-001
      x-tables:
        - club_settings
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                  description: JSON scalar matching the existing value's type (string | number | boolean)
              required:
                - value
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/SettingView"
                  message:
                    type: string
        "400":
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: AUTH_UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: SETTING_NOT_FOUND
