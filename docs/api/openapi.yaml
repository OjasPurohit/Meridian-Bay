  /shop/orders:
    post:
      operationId: shop.orderCreate
      tags:
        - Shop
      summary: "Place a shop order: member online order (pickup/delivery) or staff counter sale."
      description: |-
        channel = ONLINE for MEMBER callers, PHYSICAL for staff (server-derived, not sent). One transaction: `UPDATE products SET stock_quantity = stock_quantity - :q WHERE id = :id AND stock_quantity >= :q` per line (0 rows => OUT_OF_STOCK, rollback) + inventory_movements(SALE) + snapshot unit_price + discount = subtotal x shop_discount_percent + delivery_fee (unless free_delivery_above) + payment. Raising stock below threshold creates LOW_STOCK notifications. IN_STORE orders are created COMPLETED; ONLINE start PLACED.

        Requirements: FR-SHOP-003, FR-SHOP-004, FR-SHOP-005, FR-SHOP-006, FR-SHOP-007, FR-SHOP-008, FR-INV-001, FR-FIN-001
      x-roles:
        - MEMBER
        - FRONT_DESK
        - OWNER_ADMIN
      x-owner: Dev 3
      x-requirements:
        - FR-SHOP-003
        - FR-SHOP-004
        - FR-SHOP-005
        - FR-SHOP-006
        - FR-SHOP-007
        - FR-SHOP-008
        - FR-INV-001
        - FR-FIN-001
      x-tables:
        - shop_orders
        - shop_order_items
        - products
        - inventory_movements
        - payments
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id:
                        type: string
                        format: uuid
                      quantity:
                        type: integer
                        description: 1-99
                    required:
                      - product_id
                      - quantity
                  description: 1-50 lines; duplicate products are merged
                fulfillment:
                  type: string
                  enum:
                    - PICKUP
                    - DELIVERY
                    - IN_STORE
                  description: "MEMBER: PICKUP|DELIVERY. Staff: IN_STORE"
                delivery_address:
                  type: string
                  description: required when fulfillment = DELIVERY
                member_id:
                  type: string
                  format: uuid
                  description: "Staff only: book/order on behalf of this member. MEMBER callers: omit (implied = self)."
                guest_name:
                  type: string
                  description: Walk-in name. Staff only. Required when no member_id.
                guest_phone:
                  type: string
                  description: Walk-in phone (E.164 or 10-digit). Staff only.
                payment_method:
                  type: string
                  enum:
                    - CASH
                    - CARD
                    - UPI
                    - ONLINE
                  description: "MEMBER: ONLINE. Staff counter sale: CASH|CARD|UPI (required for IN_STORE)"
                notes:
                  type: string
              required:
                - items
                - fulfillment
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/ShopOrderDetail"
                  message:
                    type: string
        "400":
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: AUTH_UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "402":
          description: PAYMENT_FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: PRODUCT_NOT_FOUND | MEMBER_NOT_FOUND
          content:
            application/json:
