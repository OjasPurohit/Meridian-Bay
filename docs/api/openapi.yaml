      summary: Record a payment against a booking, social participation, membership, shop order, bar order, tab or invoice.
      description: |-
        revenue_category derived from source_type (INVOICE: BUSINESS or MEMBERSHIP from invoice_type). tax_amount derived (tax-inclusive sources) or proportional (invoices). Updates the source payment_status (invoices: amount_paid + status PARTIALLY_PAID/PAID) in the same transaction. BAR_ORDER sources that belong to a tab are rejected (settle the tab). ONLINE goes through the mock gateway of the hackathon build (ADR-011): an amount whose paise are .13 (e.g. 100.13) returns PAYMENT_FAILED.

        Requirements: FR-FIN-001, FR-FIN-002, FR-INVC-004, FR-FIN-010
      x-roles:
