      description: |-
        Invoices are tax-EXCLUSIVE: subtotal = sum(line_total); tax_amount = round(subtotal x tax_rate / 100, 2); total_amount = subtotal + tax_amount.

        Requirements: FR-INVC-002, FR-INVC-006, FR-INVC-003
      x-roles:
        - OWNER_ADMIN
