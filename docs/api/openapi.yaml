paths:
  /auth/signup:
    post:
      operationId: auth.signup
      tags:
        - Authentication
      summary: "Visitor joins as a member: account + the chosen membership, paid online, in one step; the member is logged in."
      description: |-
        Creates `users` (role MEMBER) + `members` (+ `memberships` + `payments` when a plan is given) in ONE transaction: if the payment fails nothing is created. The password is stored only as a bcrypt hash.

        Requirements: FR-AUTH-001, FR-MEM-012
      x-roles:
        - PUBLIC
      x-owner: Dev 1
      x-requirements:
        - FR-AUTH-001
        - FR-MEM-012
      x-tables:
        - users
        - members
        - memberships
        - payments
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  description: 2-120 chars
                email:
                  type: string
                  format: email
                  description: unique (case-insensitive)
                phone:
                  type: string
                password:
                  type: string
                  description: min 8 chars, >=1 letter and >=1 digit
                date_of_birth:
                  type: string
                  format: date
                  description: must be in the past; REQUIRED for a JUNIOR plan
                address:
                  type: string
                membership_plan_id:
                  type: string
                  format: uuid
                  description: the plan to buy now (paid ONLINE through the mock gateway). Omit to join without a plan.
              required:
                - full_name
                - email
                - phone
                - password
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/AuthSession"
                  message:
                    type: string
        "400":
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "402":
          description: PAYMENT_FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: MEMBERSHIP_PLAN_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: EMAIL_TAKEN | APPLICATION_PENDING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: JUNIOR_AGE_INVALID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/login:
    post:
      operationId: auth.login
      tags:
        - Authentication
      summary: Authenticate and receive a JWT plus the role-based landing route, or the EMPLOYEE_APPLICATION_PENDING state.
      description: |-
        `redirect_to` = ROLE_HOME_ROUTE[user.role]. Active users are checked first. If there is no such user but a PENDING job application for the email whose bcrypt hash matches, the answer is `{state: EMPLOYEE_APPLICATION_PENDING, redirect_to: /employee-application-pending}`: NO token, NO role. Never reveal whether the email exists (always AUTH_INVALID).

        Requirements: FR-AUTH-002, FR-AUTH-003, FR-AUTH-008
      x-roles:
        - PUBLIC
      x-owner: Dev 1
      x-requirements:
        - FR-AUTH-002
        - FR-AUTH-003
        - FR-AUTH-008
      x-tables:
        - users
        - employee_applications
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required:
                - email
                - password
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/AuthSession"
                  message:
                    type: string
        "400":
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: AUTH_INVALID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: ACCOUNT_DISABLED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/logout:
    post:
      operationId: auth.logout
      tags:
        - Authentication
      summary: "End the session (stateless JWT: the client discards the token)."
      description: "Requirements: FR-AUTH-004"
      x-roles:
        - MEMBER
        - FRONT_DESK
        - KITCHEN_MANAGER
        - STORE_MANAGER
        - OWNER_ADMIN
      x-owner: Dev 1
      x-requirements:
        - FR-AUTH-004
      x-tables: []
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    nullable: true
                  message:
                    type: string
        "401":
          description: AUTH_UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/me:
    get:
      operationId: auth.me
      tags:
        - Authentication
      summary: Current user + role profile + landing route. Re-issues a fresh token.
      description: "Requirements: FR-AUTH-002"
      x-roles:
        - MEMBER
        - FRONT_DESK
        - KITCHEN_MANAGER
        - STORE_MANAGER
        - OWNER_ADMIN
      x-owner: Dev 1
      x-requirements:
        - FR-AUTH-002
      x-tables:
        - users
        - members
        - staff
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/AuthSession"
                  message:
                    type: string
        "401":
          description: AUTH_UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/change-password:
    post:
      operationId: auth.changePassword
      tags:
        - Authentication
      summary: Change own password (clears must_change_password).
      description: "Requirements: FR-AUTH-006"
      x-roles:
        - MEMBER
        - FRONT_DESK
        - KITCHEN_MANAGER
        - STORE_MANAGER
        - OWNER_ADMIN
      x-owner: Dev 1
      x-requirements:
        - FR-AUTH-006
      x-tables:
        - users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  description: min 8 chars, >=1 letter and >=1 digit
              required:
                - current_password
                - new_password
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    nullable: true
                  message:
                    type: string
        "400":
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: AUTH_UNAUTHORIZED | AUTH_INVALID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /public/club:
    get:
      operationId: public.club
      tags:
        - Public website
      summary: Club introduction, timings, contact and sports offered.
      description: |-
        Built from club_settings where is_public = true plus distinct sport_type of active courts.

        Requirements: FR-PUB-001, FR-PUB-007
      x-roles:
        - PUBLIC
      x-owner: Dev 1
      x-requirements:
        - FR-PUB-001
        - FR-PUB-007
      x-tables:
        - club_settings
        - courts
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/PublicClubInfo"
                  message:
                    type: string
  /members:
    get:
      operationId: members.list
      tags:
        - Members
      summary: Search and filter members.
      description: "Requirements: FR-MEM-002, FR-MEM-006"
      x-roles:
        - FRONT_DESK
        - OWNER_ADMIN
      x-owner: Dev 2
      x-requirements:
        - FR-MEM-002
        - FR-MEM-006
      x-tables:
        - members
        - users
        - memberships
        - membership_plans
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: matches full_name, phone, email, member_code (case-insensitive contains)
          schema:
            type: string
        - name: membership_type
          in: query
          required: false
          schema:
            type: string
            enum:
              - GOLD
              - SILVER
              - JUNIOR
        - name: membership_status
          in: query
          required: false
          schema:
            type: string
            enum:
              - UPCOMING
              - ACTIVE
              - EXPIRED
              - CANCELLED
        - name: no_plan
          in: query
          required: false
          description: true = members with no current membership
          schema:
            type: boolean
        - name: expiring_within_days
          in: query
          required: false
          description: ">=0"
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MemberSummary"
                  message:
                    type: string
                  meta:
                    $ref: "#/components/schemas/PageMeta"
        "400":
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: AUTH_UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: members.create
      tags:
        - Members
      summary: Register a new member at the front desk (optionally buying a plan immediately).
      description: |-
        One transaction: users + members (+ memberships + payments when a plan is bought).

        Requirements: FR-MEM-001, FR-MEM-012
      x-roles:
        - FRONT_DESK
        - OWNER_ADMIN
      x-owner: Dev 2
      x-requirements:
        - FR-MEM-001
        - FR-MEM-012
      x-tables:
        - users
        - members
        - memberships
        - payments
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                date_of_birth:
                  type: string
                  format: date
                  description: REQUIRED when membership_plan_id is a JUNIOR plan
                address:
                  type: string
                emergency_contact_name:
                  type: string
                emergency_contact_phone:
                  type: string
                initial_password:
                  type: string
                  description: if omitted the server generates one; account gets must_change_password = true
                membership_plan_id:
                  type: string
                  format: uuid
                  description: buy this plan now
                payment_method:
                  type: string
                  enum:
                    - CASH
                    - CARD
                    - UPI
                    - ONLINE
                  description: REQUIRED when membership_plan_id is given
              required:
                - full_name
                - email
                - phone
      responses:
