  /members:
    get:
      operationId: members.list
      tags:
        - Members
      summary: Search and filter members.
      description: "Requirements: FR-MEM-002, FR-MEM-006"
      x-roles:
        - FRONT_DESK
        - OWNER_ADMIN
      x-owner: Dev 2
      x-requirements:
        - FR-MEM-002
        - FR-MEM-006
      x-tables:
        - members
        - users
        - memberships
        - membership_plans
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: matches full_name, phone, email, member_code (case-insensitive contains)
          schema:
            type: string
        - name: membership_type
          in: query
          required: false
          schema:
            type: string
            enum:
              - GOLD
              - SILVER
              - JUNIOR
        - name: membership_status
          in: query
          required: false
          schema:
            type: string
            enum:
              - UPCOMING
              - ACTIVE
              - EXPIRED
              - CANCELLED
              - CHANGED
        - name: no_plan
          in: query
          required: false
          description: true = members with no current membership
          schema:
            type: boolean
        - name: expiring_within_days
          in: query
          required: false
          description: ">=0"
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MemberSummary"
                  message:
                    type: string
                  meta:
                    $ref: "#/components/schemas/PageMeta"
        "400":
          description: VALIDATION_ERROR
