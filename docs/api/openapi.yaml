      description: |-
        Transaction: lock member (advisory) -> check plays-per-day (REGULAR + joined social, IST day, max = plan.max_plays_per_day, default 2) -> compute price -> INSERT (DB exclusion constraint `court_bookings_no_overlap` is the final arbiter; map SQLSTATE 23P01 to BOOKING_CONFLICT) -> optional payment. Expired/no membership => customer_type MEMBER but walk-in price. Free (amount_due 0) => payment_status NOT_REQUIRED.

        Requirements: FR-COURT-004, FR-COURT-005, FR-COURT-006, FR-COURT-007, FR-COURT-008, FR-COURT-009, FR-COURT-003
