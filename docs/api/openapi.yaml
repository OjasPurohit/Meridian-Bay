      operationId: memberships.purchase
      tags:
        - Membership plans & memberships
      summary: Buy or renew a membership. Records the payment.
      description: |-
        No current term: new membership starting today (derived status ACTIVE). Current term ends within `membership_expiry_warning_days`: new term starts the day after the current end_date (derived status UPCOMING until then). Otherwise MEMBERSHIP_ALREADY_ACTIVE (the DB rejects overlapping live terms: memberships_no_overlap). end_date = start_date + duration_months - 1 day. A membership is only member + plan + start/end date + price_paid: its status is derived from the dates (view membership_terms), never stored.

        Requirements: FR-MEM-007, FR-MEM-012, FR-FIN-001
      x-roles:
        - MEMBER:own
        - FRONT_DESK
        - OWNER_ADMIN
      x-owner: Dev 2
