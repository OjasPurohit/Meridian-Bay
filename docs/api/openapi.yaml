        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                member_id:
                  type: string
                  format: uuid
                  description: "Staff only; MEMBER callers: implied = self"
                membership_plan_id:
                  type: string
                  format: uuid
                payment_method:
                  type: string
                  enum:
                    - CASH
                    - CARD
                    - UPI
                    - ONLINE
                  description: MEMBER callers must use ONLINE
                gateway_reference:
                  type: string
              required:
                - membership_plan_id
