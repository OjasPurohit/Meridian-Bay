        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                court_id:
                  type: string
                  format: uuid
                start_at:
                  type: string
                  format: date-time
                  description: on a :00/:30 boundary, in the future, session must end by club_close_time
                member_id:
