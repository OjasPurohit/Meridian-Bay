          example: "1250.00"
        refunds_total:
          type: string
          pattern: ^\d+\.\d{2}$
          example: "1250.00"
        by_category:
          type: array
          items:
            $ref: "#/components/schemas/AmountByKey"
        by_method:
          type: array
          items:
            $ref: "#/components/schemas/AmountByKey"
        invoices:
          type: object
          properties:
            outstanding_amount:
              type: string
              pattern: ^\d+\.\d{2}$
              example: "1250.00"
            outstanding_count:
              type: number
            overdue_amount:
              type: string
              pattern: ^\d+\.\d{2}$
              example: "1250.00"
            overdue_count:
              type: number
          required:
            - outstanding_amount
            - outstanding_count
            - overdue_amount
            - overdue_count
        payroll:
          type: object
          properties:
            paid_amount:
              type: string
              pattern: ^\d+\.\d{2}$
              example: "1250.00"
            pending_amount:
              type: string
              pattern: ^\d+\.\d{2}$
              example: "1250.00"
          required:
            - paid_amount
            - pending_amount
        tax_collected:
          type: string
          pattern: ^\d+\.\d{2}$
          example: "1250.00"
      required:
        - range
        - revenue_total
        - refunds_total
        - by_category
        - by_method
        - invoices
        - payroll
        - tax_collected
    TaxReport:
      type: object
      properties:
        range:
          $ref: "#/components/schemas/DateRange"
        rows:
          type: array
          items:
            type: object
            properties:
              revenue_category:
                type: string
                enum:
                  - COURT
                  - MEMBERSHIP
                  - SHOP
                  - BAR
                  - BUSINESS
              gross_amount:
                type: string
                pattern: ^\d+\.\d{2}$
                example: "1250.00"
              taxable_amount:
                type: string
                pattern: ^\d+\.\d{2}$
                example: "1250.00"
              tax_rate:
                type: string
                pattern: ^\d+\.\d{2}$
                example: "18.00"
              tax_amount:
                type: string
                pattern: ^\d+\.\d{2}$
                example: "1250.00"
            required:
              - revenue_category
              - gross_amount
              - taxable_amount
              - tax_rate
              - tax_amount
        total_tax:
          type: string
          pattern: ^\d+\.\d{2}$
          example: "1250.00"
      required:
        - range
        - rows
        - total_tax
    CountResult:
      type: object
      properties:
        count:
          type: number
      required:
        - count
    ExpiryRunResult:
      type: object
      properties:
        promoted_count:
          type: number
        expired_count:
          type: number
        notified_count:
          type: number
      required:
        - promoted_count
        - expired_count
        - notified_count
    UserPublic:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum:
            - MEMBER
            - FRONT_DESK
            - KITCHEN_MANAGER
            - BUSINESS_CLIENT
            - OWNER_ADMIN
        full_name:
          type: string
        phone:
          type: string
          nullable: true
        is_active:
          type: boolean
        must_change_password:
          type: boolean
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - email
        - role
        - full_name
        - phone
        - is_active
        - must_change_password
        - last_login_at
        - created_at
        - updated_at
paths:
  /auth/signup:
    post:
      operationId: auth.signup
      tags:
        - Authentication
      summary: Visitor creates an account (role MEMBER, no plan yet) and is logged in.
      description: |-
        Creates `users` (role MEMBER) + `members` in one transaction. No membership is created: until a plan is bought the member pays walk-in rates.

        Requirements: FR-AUTH-001
      x-roles:
        - PUBLIC
      x-owner: Dev 1
      x-requirements:
        - FR-AUTH-001
      x-tables:
        - users
        - members
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  description: 2-120 chars
                email:
                  type: string
                  format: email
                  description: unique (case-insensitive)
                phone:
                  type: string
                password:
                  type: string
                  description: min 8 chars, >=1 letter and >=1 digit
                date_of_birth:
                  type: string
                  format: date
                  description: must be in the past
              required:
                - full_name
                - email
                - phone
                - password
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/AuthSession"
                  message:
                    type: string
        "400":
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: EMAIL_TAKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/login:
    post:
      operationId: auth.login
      tags:
        - Authentication
      summary: Authenticate and receive a JWT plus the role-based landing route.
      description: |-
        `redirect_to` = ROLE_HOME_ROUTE[user.role]. Never reveal whether the email exists (always AUTH_INVALID). Updates users.last_login_at.

        Requirements: FR-AUTH-002, FR-AUTH-003
      x-roles:
        - PUBLIC
      x-owner: Dev 1
      x-requirements:
        - FR-AUTH-002
        - FR-AUTH-003
      x-tables:
        - users
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required:
                - email
                - password
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/AuthSession"
                  message:
                    type: string
        "400":
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: AUTH_INVALID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: ACCOUNT_DISABLED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/logout:
    post:
      operationId: auth.logout
      tags:
        - Authentication
      summary: "End the session (stateless JWT: the client discards the token)."
      description: "Requirements: FR-AUTH-004"
      x-roles:
        - MEMBER
        - FRONT_DESK
        - KITCHEN_MANAGER
        - BUSINESS_CLIENT
        - OWNER_ADMIN
      x-owner: Dev 1
      x-requirements:
        - FR-AUTH-004
      x-tables: []
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    nullable: true
                  message:
                    type: string
        "401":
          description: AUTH_UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/me:
    get:
      operationId: auth.me
      tags:
        - Authentication
      summary: Current user + role profile + landing route. Re-issues a fresh token.
      description: "Requirements: FR-AUTH-002"
      x-roles:
        - MEMBER
        - FRONT_DESK
        - KITCHEN_MANAGER
        - BUSINESS_CLIENT
        - OWNER_ADMIN
      x-owner: Dev 1
      x-requirements:
        - FR-AUTH-002
      x-tables:
        - users
        - members
        - staff
        - business_clients
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/AuthSession"
                  message:
                    type: string
        "401":
          description: AUTH_UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/change-password:
    post:
      operationId: auth.changePassword
      tags:
        - Authentication
      summary: Change own password (clears must_change_password).
      description: "Requirements: FR-AUTH-006"
      x-roles:
        - MEMBER
        - FRONT_DESK
        - KITCHEN_MANAGER
        - BUSINESS_CLIENT
        - OWNER_ADMIN
      x-owner: Dev 1
      x-requirements:
        - FR-AUTH-006
      x-tables:
        - users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  description: min 8 chars, >=1 letter and >=1 digit
              required:
                - current_password
                - new_password
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    nullable: true
                  message:
                    type: string
        "400":
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: AUTH_UNAUTHORIZED | AUTH_INVALID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /public/club:
