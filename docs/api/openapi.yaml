        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                invoice_type:
                  type: string
                  enum:
                    - BUSINESS
                    - MEMBERSHIP
                business_client_id:
                  type: string
                  format: uuid
                  description: required for BUSINESS
                member_id:
                  type: string
                  format: uuid
                  description: required for MEMBERSHIP
                issue_date:
                  type: string
                  format: date
                  description: default today
                due_date:
                  type: string
                  format: date
                  description: ">= issue_date"
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      description:
                        type: string
                      quantity:
                        type: integer
                      unit_price:
                        type: string
                        pattern: ^\d+\.\d{2}$
                        description: TAX-EXCLUSIVE
                    required:
                      - description
                      - quantity
                      - unit_price
                  description: ">=1 line"
                tax_rate:
                  type: string
                  pattern: ^\d+(\.\d{1,2})?$
                  description: default setting tax_rate_business
                notes:
                  type: string
                send_now:
                  type: boolean
              required:
                - invoice_type
                - due_date
                - items
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
